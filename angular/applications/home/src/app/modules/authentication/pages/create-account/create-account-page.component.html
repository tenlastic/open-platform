<div align-items="stretch"
     [hidden]="!!loadingMessage"
     row-gap-32>
  <h2>
    <mat-icon>person_add</mat-icon>
    Create Account
  </h2>

  <app-registration-form (register)="onRegister($event)"></app-registration-form>

  <div column-gap-0>
    <div flex-1>
      <app-button color="accent"
                  flex-1
                  layout="vertical"
                  routerLink="../log-in">
        <mat-icon>lock</mat-icon>
        <div>Log In</div>
      </app-button>
    </div>

    <div flex-1>
      <app-button color="accent"
                  flex-1
                  layout="vertical"
                  routerLink="../reset-password">
        <mat-icon>refresh</mat-icon>
        <div>Reset Password</div>
      </app-button>
    </div>
  </div>
</div>

<app-loading-message [hidden]="!loadingMessage">{{ loadingMessage }}</app-loading-message>
