<form [formGroup]="form"
      id="form"
      row-gap-16
      (ngSubmit)="submit()">
  <ng-container *ngIf="!message">
    <app-form-field floatLabel="always">
      <label>Email Address</label>
      <input appAutofocus
             formControlName="email"
             maxlength="256"
             type="email" />
      <app-error>Enter a valid email address.</app-error>
    </app-form-field>

    <app-form-message *ngIf="error"
                      level="error"
                      text="center">{{ error }}</app-form-message>

    <app-button centered
                color="primary"
                form="form"
                layout="vertical">
      <div>Submit</div>
    </app-button>
  </ng-container>

  <div *ngIf="message"
       class="form-message">
    {{ message }}
  </div>
</form>
