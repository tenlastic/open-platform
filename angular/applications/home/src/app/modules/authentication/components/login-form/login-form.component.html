<form [formGroup]="form"
      id="form"
      row-gap-16
      (ngSubmit)="submit()">
  <app-form-field>
    <label>Username</label>
    <input appAutofocus
           formControlName="username"
           maxlength="24" />
    <app-error>Enter a valid username.</app-error>
  </app-form-field>

  <app-form-field>
    <label>Password</label>
    <input formControlName="password"
           type="password" />
    <app-error>Enter a password.</app-error>
  </app-form-field>

  <app-form-message *ngIf="error"
                    level="error"
                    text="center">{{ error }}</app-form-message>

  <app-button centered
              color="primary"
              form="form"
              layout="vertical">
    <div>Submit</div>
  </app-button>
</form>
