<form [formGroup]="form"
      id="form"
      row-gap-16
      (ngSubmit)="submit()">
  <app-form-field floatLabel="always">
    <label>Username</label>
    <input appAutofocus
           formControlName="username"
           maxlength="24" />
    <app-error>Enter a valid alphanumeric username.</app-error>
  </app-form-field>

  <div formGroupName="passwords"
       row-gap-16>
    <app-form-field floatLabel="always">
      <label>Password</label>
      <input formControlName="password"
             type="password" />
      <app-error>Enter a password.</app-error>
    </app-form-field>

    <app-form-field floatLabel="always">
      <label>Confirm Password</label>
      <input formControlName="confirmPassword"
             type="password" />
      <app-error>Passwords do not match.</app-error>
    </app-form-field>
  </div>

  <app-form-field floatLabel="always">
    <label>Email Address (Optional, for Password Reset)</label>
    <input formControlName="email"
           maxlength="256"
           type="email" />
    <app-error>Enter a valid email address.</app-error>
  </app-form-field>

  <app-form-message *ngIf="error"
                    level="error"
                    text="center">{{ error }}</app-form-message>

  <app-button centered
              color="primary"
              form="form"
              layout="vertical">
    <div>Submit</div>
  </app-button>
</form>
