<form [formGroup]="form"
      id="form"
      row-gap-16
      (ngSubmit)="submit()">
  <ng-container *ngIf="!message">
    <app-form-field floatLabel="always"
                    margin-top>
      <label>Password</label>
      <input appAutofocus
             formControlName="password"
             type="password" />
      <app-error>Enter a password.</app-error>
    </app-form-field>

    <app-form-field floatLabel="always">
      <label>Confirm Password</label>
      <input formControlName="confirmPassword"
             type="password" />
      <app-error>Passwords do not match.</app-error>
    </app-form-field>

    <app-form-message *ngIf="error"
                      level="error"
                      text="center">{{ error }}</app-form-message>

    <app-button centered
                color="primary"
                form="form"
                layout="vertical">
      <div>Submit</div>
    </app-button>
  </ng-container>

  <div *ngIf="message"
       class="form-message">
    {{ message }}
  </div>
</form>
