<app-header-toolbar *ngIf="!isElectron">
  <img src="/assets/images/logo.png" />

  <ng-container *appResponsive="'desktop'">
    <div class="space"></div>

    <app-button color="primary"
                [href]="launcherUrl">
      <div>Download Launcher</div>
    </app-button>
  </ng-container>

  <ng-container *appResponsive="'mobile'">
    <div class="space"></div>

    <app-button color="accent"
                size="large"
                (OnClick)="toggleSideMenu()">
      <mat-icon>{{ ($sideMenuIsVisible | async) ? 'close' : 'menu' }}</mat-icon>
    </app-button>
  </ng-container>
</app-header-toolbar>

<div class="row">
  <app-side-menu *appResponsive="'desktop'"></app-side-menu>

  <div class="content">
    <router-outlet></router-outlet>
  </div>

  <ng-container *appResponsive="'mobile'">
    <app-side-menu-overlay *ngIf="$sideMenuIsVisible | async">
      <app-side-menu></app-side-menu>
    </app-side-menu-overlay>
  </ng-container>
</div>

<ng-template #sideMenu>
  <app-button color="accent"
              layout="vertical"
              routerLink="/account"
              routerLinkActive="active"
              text="left"
              width="full">
    <mat-icon>manage_accounts</mat-icon>
    <div>Account Information</div>
  </app-button>

  <app-button color="accent"
              layout="vertical"
              routerLink="/authentication/log-out"
              routerLinkActive="active"
              text="left"
              width="full">
    <mat-icon>logout</mat-icon>
    <div>Log Out</div>
  </app-button>
</ng-template>
