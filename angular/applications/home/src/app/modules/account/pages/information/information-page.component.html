<div *ngIf="form"
     class="content">
  <app-title>Account Information</app-title>

  <app-loading-message *ngIf="loadingMessage">{{ loadingMessage }}</app-loading-message>

  <form autocomplete="off"
        [formGroup]="form"
        id="form"
        row-gap-16
        (ngSubmit)="save()">
    <div column-gap-16
         flex-wrap>
      <app-form-field>
        <label>Email Address</label>
        <input formControlName="email"
               type="email" />
        <app-error>Enter a valid email address.</app-error>
      </app-form-field>

      <app-form-field>
        <label>Username</label>
        <input formControlName="username" />
        <app-error>Enter a valid username.</app-error>
      </app-form-field>
    </div>

    <div *ngIf="form.get('steamId').value || form.get('steamPersonaName').value"
         column-gap-16>
      <app-form-field *ngIf="form.get('steamId').value">
        <label>Steam ID</label>
        <input formControlName="steamId" />
        <app-error>Enter a valid Steam ID.</app-error>
      </app-form-field>

      <app-form-field *ngIf="form.get('steamPersonaName').value">
        <label>Steam Persona name</label>
        <input formControlName="steamPersonaName" />
        <app-error>Enter a valid Steam Persona Name.</app-error>
      </app-form-field>
    </div>
  </form>
</div>

<div *ngIf="form && !form.disabled"
     class="actions">
  <div *ngFor="let error of errors"
       class="form-error">
    {{ error }}
  </div>

  <app-button color="primary"
              form="form"
              size="large"
              width="full">
    <mat-icon>save</mat-icon>
    <div>Save</div>
  </app-button>
</div>
