<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title>{{ data?._id ? 'Edit' : 'Create' }} Storefront</app-title>

      <div class="header-end">
        <app-button color="accent"
                    (OnClick)="navigateToForm()">
          <mat-icon>format_list_bulleted</mat-icon>
          <div>{{ data?._id ? 'Edit' : 'Create' }} as Form</div>
        </app-button>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          (ngSubmit)="save()">
      <div class="form-row">
        <app-form-field>
          <label>JSON</label>
          <textarea appAutofocus
                    cdkTextareaAutosize
                    formControlName="json"
                    spellcheck="false"
                    type="text"
                    (keydown)="onKeyDown($event)"
                    (keyup)="onKeyUp($event)"></textarea>
          <app-error>JSON is not valid.</app-error>
        </app-form-field>
      </div>
    </form>
  </div>

  <div *ngIf="!form?.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled="true"
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
