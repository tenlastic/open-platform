<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title *ngIf="hasWriteAuthorization">{{ data?._id ? 'Edit' : 'Create' }} Steam Integration</app-title>
      <app-title *ngIf="!hasWriteAuthorization">View Steam Integration</app-title>

      <div *ngIf="hasWriteAuthorization"
           class="header-end">
        <app-button color="accent"
                    (OnClick)="navigateToJson()">
          <mat-icon>code</mat-icon>
          <div>{{ data?._id ? 'Edit' : 'Create' }} as JSON</div>
        </app-button>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          (ngSubmit)="save()">
      <div class="form-row">
        <app-form-field floatLabel="always">
          <label>Name</label>
          <input appAutofocus
                 formControlName="name"
                 maxlength="64"
                 required />
          <app-error>Enter a valid name.</app-error>
        </app-form-field>
      </div>

      <div class="form-row">
        <app-form-field floatLabel="always">
          <label>API Key</label>
          <input formControlName="apiKey"
                 maxlength="64"
                 required />
          <app-error>Enter a valid API Key.</app-error>
        </app-form-field>

        <app-form-field floatLabel="always">
          <label>Application ID</label>
          <input formControlName="applicationId"
                 min="0"
                 required
                 type="number" />
          <app-error>Enter a valid Application ID.</app-error>
        </app-form-field>
      </div>

      <hr>

      <app-toggle-section title="Roles">
        <app-role-fields [form]="form"
                         [play]="true"></app-role-fields>
      </app-toggle-section>
    </form>
  </div>

  <div *ngIf="!form.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled="true"
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
