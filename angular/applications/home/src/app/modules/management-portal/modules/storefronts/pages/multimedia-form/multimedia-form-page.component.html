<div class="page">
  <div class="header">
    <app-title>Edit Images / Videos</app-title>
  </div>

  <hr>

  <app-toggle-section *ngIf="data"
                      title="Background Image">
    <div class="form-column">
      <div *ngIf="data.background || pending['background'].length"
           class="grid-list">
        <div *ngIf="data.background"
             class="grid-list-item"
             [ngStyle]="{ 'background-image': 'url(' + data.background + ')' }">
          <app-button color="accent"
                      (OnClick)="view(data.background)">
            <mat-icon>fullscreen</mat-icon>
            <div>View</div>
          </app-button>
        </div>

        <div *ngIf="!data.background"
             class="grid-list-item pending">
          <mat-spinner [diameter]="30"></mat-spinner>
        </div>
      </div>

      <input #backgroundInput
             accept=".jpg,.jpeg,.png"
             hidden
             type="file"
             (change)="onFieldChanged($event, 'background')" />

      <div align-items="center"
           column-gap-8>
        <app-button color="primary"
                    layout="left"
                    (OnClick)="backgroundInput.click()">Browse</app-button>
        <app-button *ngIf="data.background"
                    color="accent"
                    layout="left"
                    (OnClick)="remove('background')">Remove</app-button>

        <div *ngFor="let error of uploadErrors['background']"
             class="form-error">
          {{ error }}
        </div>
      </div>
    </div>
  </app-toggle-section>

  <hr>

  <app-toggle-section *ngIf="data"
                      title="Icon Image">
    <div class="form-column">
      <div *ngIf="data.icon || pending['icon'].length"
           class="grid-list">
        <div *ngIf="data.icon"
             class="grid-list-item icon"
             [ngStyle]="{ 'background-image': 'url(' + data.icon + ')' }">
        </div>

        <div *ngIf="!data.icon"
             class="grid-list-item pending">
          <mat-spinner [diameter]="30"></mat-spinner>
        </div>
      </div>

      <input #iconInput
             accept=".jpg,.jpeg,.png"
             hidden
             type="file"
             (change)="onFieldChanged($event, 'icon')" />

      <div align-items="center"
           column-gap-8>
        <app-button color="primary"
                    layout="left"
                    (OnClick)="iconInput.click()">Browse</app-button>
        <app-button *ngIf="data.icon"
                    color="accent"
                    layout="left"
                    (OnClick)="remove('icon')">Remove</app-button>

        <div *ngFor="let error of uploadErrors['icon']"
             class="form-error">
          {{ error }}
        </div>
      </div>
    </div>
  </app-toggle-section>

  <hr>

  <app-toggle-section *ngIf="data"
                      title="Logo Image">
    <div class="form-column">
      <div *ngIf="data.logo || pending['logo'].length"
           class="grid-list">
        <div *ngIf="data.logo"
             class="icon grid-list-item"
             [ngStyle]="{ 'background-image': 'url(' + data.logo + ')' }">
        </div>

        <div *ngIf="!data.logo"
             class="grid-list-item pending">
          <mat-spinner [diameter]="30"></mat-spinner>
        </div>
      </div>

      <input #logoInput
             accept=".jpg,.jpeg,.png"
             hidden
             type="file"
             (change)="onFieldChanged($event, 'logo')" />

      <div align-items="center"
           column-gap-8>
        <app-button color="primary"
                    layout="left"
                    (OnClick)="logoInput.click()">Browse</app-button>
        <app-button *ngIf="data.logo"
                    color="accent"
                    layout="left"
                    (OnClick)="remove('logo')">Remove</app-button>

        <div *ngFor="let error of uploadErrors['logo']"
             class="form-error">
          {{ error }}
        </div>
      </div>
    </div>
  </app-toggle-section>

  <hr>

  <app-toggle-section *ngIf="data"
                      title="Images">
    <div class="form-column">
      <div *ngIf="data.images && data.images.length || pending['images'].length"
           class="grid-list">
        <div *ngFor="let image of data.images; let i = index"
             class="grid-list-item"
             [ngStyle]="{ 'background-image': 'url(' + image + ')' }">
          <app-button color="accent"
                      (OnClick)="remove('images', i)">
            <mat-icon>remove</mat-icon>
            <div>Remove</div>
          </app-button>

          <app-button color="accent"
                      (OnClick)="view(image)">
            <mat-icon>fullscreen</mat-icon>
            <div>View</div>
          </app-button>
        </div>

        <div *ngFor="let image of pending['images']"
             class="grid-list-item pending">
          <mat-spinner [diameter]="30"></mat-spinner>
        </div>
      </div>

      <input #imagesInput
             accept=".jpg,.jpeg,.png"
             hidden
             multiple="true"
             type="file"
             (change)="onFieldChanged($event, 'images')" />

      <div align-items="center"
           column-gap-8>
        <app-button color="primary"
                    layout="left"
                    (OnClick)="imagesInput.click()">Browse</app-button>

        <div *ngFor="let error of uploadErrors['images']"
             class="form-error">
          {{ error }}
        </div>
      </div>
    </div>
  </app-toggle-section>

  <hr>

  <app-toggle-section *ngIf="data"
                      title="Videos">
    <div class="form-column">
      <div *ngIf="data.videos && data.videos.length || pending['videos'].length"
           class="grid-list">
        <div *ngFor="let video of data.videos; let i = index"
             class="grid-list-item">
          <video>
            <source [src]="video"
                    type="video/mp4" />
          </video>

          <app-button color="accent"
                      (OnClick)="remove('videos', i)">
            <mat-icon>remove</mat-icon>
            <div>Remove</div>
          </app-button>

          <app-button color="accent"
                      (OnClick)="view(video, 'video')">
            <mat-icon>fullscreen</mat-icon>
            <div>View</div>
          </app-button>
        </div>

        <div *ngFor="let image of pending['videos']"
             class="grid-list-itempending">
          <mat-spinner [diameter]="30"></mat-spinner>
        </div>
      </div>

      <input #videosInput
             accept=".mp4"
             hidden
             multiple="true"
             type="file"
             (change)="onFieldChanged($event, 'videos')" />

      <div align-items="center"
           column-gap-8>
        <app-button color="primary"
                    layout="left"
                    (OnClick)="videosInput.click()">Browse</app-button>

        <div *ngFor="let error of uploadErrors['videos']"
             class="form-error">
          {{ error }}
        </div>
      </div>
    </div>
  </app-toggle-section>
</div>
