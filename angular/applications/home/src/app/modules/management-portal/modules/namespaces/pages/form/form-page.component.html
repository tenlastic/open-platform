<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title *ngIf="hasWriteAuthorization || hasWriteAuthorizationForNamespace">
        {{ data?._id ? 'Edit' : 'Create' }} Namespace
      </app-title>
      <app-title *ngIf="!hasWriteAuthorization && !hasWriteAuthorizationForNamespace">View Namespace</app-title>

      <div *ngIf="hasWriteAuthorization || hasWriteAuthorizationForNamespace"
           class="header-end">
        <app-button color="accent"
                    (OnClick)="navigateToJson()">
          <mat-icon>code</mat-icon>
          <div>{{ data?._id ? 'Edit' : 'Create' }} as JSON</div>
        </app-button>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          (ngSubmit)="save()">
      <div class="form-row">
        <app-form-field>
          <label>Name</label>
          <input appAutofocus
                 formControlName="name"
                 maxlength="64"
                 required />
          <app-error>Enter a valid name.</app-error>
        </app-form-field>
      </div>

      <hr>

      <app-toggle-section formArrayName="limits"
                          title="Limits">
        <div class="form-row">
          <app-form-field>
            <label>Total Bandwidth (GB) / Month</label>
            <input required
                   formControlName="bandwidth"
                   type="number" />
            <app-error>Enter a valid value.</app-error>
          </app-form-field>

          <app-form-field>
            <label>Total CPUs</label>
            <input required
                   formControlName="cpu"
                   type="number" />
            <app-error>Enter a valid value.</app-error>
          </app-form-field>

          <app-form-field>
            <label>Default Authorization</label>
            <input *ngIf="form.get('limits').get('defaultAuthorization').disabled"
                   disabled
                   [value]="form.get('limits').get('defaultAuthorization').value ? 'Yes' : 'No'" />
            <mat-select *ngIf="!form.get('limits').get('defaultAuthorization').disabled"
                        formControlName="defaultAuthorization">
              <mat-option [value]="true">Yes</mat-option>
              <mat-option [value]="false">No</mat-option>
            </mat-select>
          </app-form-field>

          <app-form-field>
            <label>Total Memory (GB)</label>
            <input required
                   formControlName="memory"
                   type="number" />
            <app-error>Enter a valid value.</app-error>
          </app-form-field>

          <app-form-field>
            <label>Non-Preemptible Nodes</label>
            <input *ngIf="form.get('limits').get('nonPreemptible').disabled"
                   disabled
                   [value]="form.get('limits').get('nonPreemptible').value ? 'Yes' : 'No'" />
            <mat-select *ngIf="!form.get('limits').get('nonPreemptible').disabled"
                        formControlName="nonPreemptible">
              <mat-option [value]="true">Yes</mat-option>
              <mat-option [value]="false">No</mat-option>
            </mat-select>
          </app-form-field>

          <app-form-field>
            <label>Total Storage (GB)</label>
            <input required
                   formControlName="storage"
                   step="1"
                   type="number" />
            <app-error>Enter a valid value.</app-error>
          </app-form-field>
        </div>
      </app-toggle-section>

      <ng-container *ngIf="data.status">
        <hr>

        <app-toggle-section title="Status">
          <div class="form-column">
            <div class="form-row">
              <app-form-field>
                <label>Phase</label>
                <input disabled
                       [value]="data.status.phase" />
              </app-form-field>
            </div>

            <h4>Components</h4>

            <div class="form-row">
              <app-form-field *ngFor="let component of data.status.components">
                <label>{{ component.name }}</label>
                <input disabled
                       [value]="getComponentValue(component)" />
              </app-form-field>
            </div>

            <h4>Limits</h4>

            <div class="form-row">
              <app-form-field>
                <label>Total CPUs</label>
                <input disabled
                       [value]="data.status.limits.cpu | number:'1.0':'en-US'" />
              </app-form-field>

              <app-form-field>
                <label>Total Memory</label>
                <input disabled
                       [value]="data.status.limits.memory | filesize" />
              </app-form-field>

              <app-form-field>
                <label>Total Storage</label>
                <input disabled
                       [value]="data.status.limits.storage | filesize" />
              </app-form-field>
            </div>
          </div>
        </app-toggle-section>

      </ng-container>
    </form>
  </div>

  <div *ngIf="!form.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled="true"
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
