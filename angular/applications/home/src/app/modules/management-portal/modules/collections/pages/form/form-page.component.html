<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title *ngIf="hasWriteAuthorization">{{ data?._id ? 'Edit' : 'Create' }} Collection</app-title>
      <app-title *ngIf="!hasWriteAuthorization">View Collection</app-title>

      <div class="header-end">
        <app-button *ngIf="hasWriteAuthorization"
                    color="accent"
                    (OnClick)="navigateToJson()">
          <mat-icon>code</mat-icon>
          <div>{{ data?._id ? 'Edit' : 'Create' }} as JSON</div>
        </app-button>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          (ngSubmit)="save()">
      <div class="form-row">
        <app-form-field>
          <label>Name</label>
          <input appAutofocus
                 formControlName="name"
                 maxlength="64" />
          <app-error>Enter a valid name.</app-error>
        </app-form-field>
      </div>

      <hr>

      <app-toggle-section title="Properties">
        <div row-gap-8>
          <div *ngFor="let property of properties.controls; let i = index"
               row-gap-4>
            <h4>Property {{ i + 1 }}</h4>

            <ng-container formArrayName="properties">
              <app-property-field [form]="property"
                                  (remove)="removeProperty(i)"></app-property-field>
            </ng-container>
          </div>

          <app-button *ngIf="!form.disabled"
                      color="accent"
                      layout="left"
                      (OnClick)="addProperty()">
            <mat-icon>add</mat-icon>
            <div>Add Property</div>
          </app-button>
        </div>
      </app-toggle-section>

      <hr>

      <app-toggle-section title="Roles">
        <div row-gap-8>
          <div *ngFor="let role of roles.controls; let i = index"
               row-gap-4>
            <h4>Role {{ i + 1 }}</h4>

            <ng-container formArrayName="roles">
              <app-role-field [form]="role"
                              [index]="i"
                              [length]="roles.length"
                              [properties]="properties"
                              (moveDown)="moveRoleDown(i)"
                              (moveUp)="moveRoleUp(i)"
                              (remove)="removeRole(i)"></app-role-field>
            </ng-container>

            <hr>
          </div>

          <app-button *ngIf="!form.disabled"
                      color="accent"
                      layout="left"
                      (OnClick)="addRole()">
            <mat-icon>add</mat-icon>
            <div>Add Role</div>
          </app-button>
        </div>
      </app-toggle-section>
    </form>
  </div>

  <div *ngIf="!form.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled="true"
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
