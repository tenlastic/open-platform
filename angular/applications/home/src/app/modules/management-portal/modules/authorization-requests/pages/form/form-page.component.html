<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title *ngIf="hasWriteAuthorization">{{ data?._id ? 'Edit' : 'Create' }} Authorization Request</app-title>
      <app-title *ngIf="!hasWriteAuthorization">View Authorization Request</app-title>
    </div>

    <hr>

    <form [formGroup]="form">
      <div class="form-row">
        <app-autocomplete-user-field [control]="form.get('user')"></app-autocomplete-user-field>
      </div>

      <hr>

      <app-toggle-section title="Roles">
        <app-role-fields [form]="form"></app-role-fields>
      </app-toggle-section>

      <hr>

      <app-toggle-section title="Status">
        <app-form-field *ngIf="data.deniedAt"
                        floatLabel="always">
          <label>Denied At</label>
          <input disabled
                 [value]="data.deniedAt | date" />
        </app-form-field>

        <app-form-field *ngIf="data.grantedAt"
                        floatLabel="always">
          <label>Granted At</label>
          <input disabled
                 [value]="data.grantedAt | date" />
        </app-form-field>

        <app-form-field *ngIf="!data.deniedAt && !data.grantedAt"
                        floatLabel="always">
          <label>Requested At</label>
          <input disabled
                 [value]="data.updatedAt | date" />
        </app-form-field>
      </app-toggle-section>
    </form>
  </div>

  <div *ngIf="!data.deniedAt && !data.grantedAt"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <div *ngIf="!isSaving"
         column-gap-8>
      <div flex-1>
        <app-button color="accent"
                    size="large"
                    width="full"
                    (OnClick)="deny()">
          <mat-icon>close</mat-icon>
          <div>Deny</div>
        </app-button>
      </div>

      <div flex-1>
        <app-button color="primary"
                    size="large"
                    width="full"
                    (OnClick)="grant()">
          <mat-icon>check</mat-icon>
          <div>Grant</div>
        </app-button>
      </div>
    </div>

    <app-button *ngIf="isSaving"
                color="primary"
                disabled
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
