<div class="page">
  <div class="header">
    <app-title>Users</app-title>

    <div class="header-end">
      <app-button color="accent"
                  (OnClick)="table.refresh()">
        <mat-icon>refresh</mat-icon>
        <div>Refresh</div>
      </app-button>
    </div>
  </div>

  <hr>

  <app-toggle-section [isVisible]="false"
                      title="Filters">
    <app-data-source-filter (OnValueSet)="$filter.next($event)">
      Email Address / Steam Persona Name / Username
    </app-data-source-filter>
  </app-toggle-section>

  <hr>

  <ng-template #actions
               let-element>
    <ng-container *ngIf="hasWriteAuthorization">
      <app-button *ngIf="element._id !== user._id"
                  appHighlight
                  color="accent"
                  (OnClick)="showDeletePrompt($event, element)">
        <mat-icon>delete</mat-icon>
        <div>Delete</div>
      </app-button>
    </ng-container>
  </ng-template>

  <app-list-table #table
                  [$records]="$records"
                  [columns]="columns"
                  [count]="count"
                  [filter]="filter"
                  [find]="find"
                  [navigate]="navigate"
                  [subscriptions]="subscriptions"
                  [template]="actions"
                  [webSocket]="webSocket">
  </app-list-table>
</div>
