<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title>{{ data?._id ? 'Edit' : 'Create' }} Storefront</app-title>

      <div class="header-end">
        <app-button *ngIf="hasWriteAuthorization"
                    color="accent"
                    (OnClick)="navigateToJson()">
          <mat-icon>code</mat-icon>
          <div>{{ data?._id ? 'Edit' : 'Create' }} as JSON</div>
        </app-button>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          (ngSubmit)="save()">
      <div class="form-row">
        <app-form-field>
          <label>Title</label>
          <input appAutofocus
                 formControlName="title"
                 maxlength="32"
                 required />
          <app-error>Enter a valid title.</app-error>
        </app-form-field>

        <app-form-field>
          <label>Subtitle</label>
          <input formControlName="subtitle"
                 maxlength="32" />
          <app-error>Enter a valid subtitle.</app-error>
        </app-form-field>
      </div>

      <hr>

      <div class="form-row">
        <div flex-1>
          <app-form-field width="full">
            <label>Description</label>
            <textarea cdkTextareaAutosize
                      formControlName="description"
                      type="text"></textarea>
            <app-error>Enter a valid description.</app-error>
          </app-form-field>
        </div>

        <div *ngIf="form.get('description').value"
             class="markdown-preview"
             flex-1>
          <label>Description (Preview)</label>
          <app-markdown [markdown]="form.get('description').value"></app-markdown>
        </div>
      </div>

      <hr>

      <div class="form-row">
        <app-form-field>
          <label>Show Game Servers</label>
          <mat-select formControlName="showGameServers">
            <mat-option [value]="true">Yes</mat-option>
            <mat-option [value]="false">No</mat-option>
          </mat-select>
        </app-form-field>

        <app-form-field>
          <label>Show Queues</label>
          <mat-select formControlName="showQueues">
            <mat-option [value]="true">Yes</mat-option>
            <mat-option [value]="false">No</mat-option>
          </mat-select>
        </app-form-field>
      </div>

      <hr>

      <app-toggle-section title="Metadata">
        <app-metadata-fields [formArray]="form.get('metadata')"></app-metadata-fields>
      </app-toggle-section>

      <hr>

      <app-toggle-section title="Roles">
        <app-role-fields [form]="form"
                         [play]="true"></app-role-fields>
      </app-toggle-section>
    </form>
  </div>

  <div *ngIf="!form.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled="true"
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
