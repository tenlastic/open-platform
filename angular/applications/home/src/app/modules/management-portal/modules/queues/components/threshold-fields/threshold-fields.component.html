<div row-gap-8>
  <div *ngFor="let threshold of formArray.controls; let i = index"
       row-gap-4>
    <h4>Threshold {{ i + 1 }}</h4>

    <div class="form-row"
         [formGroup]="formArray.at(i)">
      <app-form-field>
        <label>Seconds</label>
        <input formControlName="seconds"
               min="0"
               type="number" />
        <app-error>Enter a valid number of seconds.</app-error>
      </app-form-field>

      <app-form-field *ngIf="teams">
        <label>Rating</label>
        <input formControlName="rating"
               min="0"
               type="number" />
        <app-error>Enter a valid rating.</app-error>
      </app-form-field>

      <ng-container formArrayName="usersPerTeam">
        <app-form-field *ngFor="let control of getUsersPerTeam(i).controls; let j = index">
          <label>Team {{ j + 1 }}</label>

          <input autocomplete="off"
                 [formControlName]="j"
                 min="1"
                 step="1"
                 type="number" />
          <app-button *ngIf="getUsersPerTeam(i).length > 1"
                      color="accent"
                      mat-icon-button
                      matSuffix
                      matTooltip="Remove Team"
                      (OnClick)="getUsersPerTeam(i).removeAt(j)">
            <mat-icon>remove</mat-icon>
          </app-button>

          <app-error>Enter a valid number of players.</app-error>
        </app-form-field>
      </ng-container>

      <app-button *ngIf="!formArray?.disabled"
                  color="accent"
                  layout="left"
                  (OnClick)="pushUsersPerTeam(getUsersPerTeam(i))">
        <mat-icon>add</mat-icon>
        <div>Add Team</div>
      </app-button>

      <app-button *ngIf="!formArray?.disabled && formArray?.length > 1"
                  color="accent"
                  layout="left"
                  (OnClick)="formArray.removeAt(i)">
        <mat-icon>remove</mat-icon>
        <div>Remove Threshold</div>
      </app-button>
    </div>
  </div>

  <div *ngIf="!formArray?.disabled"
       class="form-row">
    <app-button color="accent"
                layout="left"
                (OnClick)="push()">
      <mat-icon>add</mat-icon>
      <div>Add Threshold</div>
    </app-button>
  </div>
</div>
