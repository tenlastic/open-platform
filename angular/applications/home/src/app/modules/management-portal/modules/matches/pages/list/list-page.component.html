<div class="page">
  <div class="header">
    <app-title>Matches</app-title>

    <div class="header-end">
      <app-button *ngIf="hasWriteAuthorization"
                  color="accent"
                  [routerLink]="['new']">
        <mat-icon>add</mat-icon>
        <div>New Match</div>
      </app-button>
      <app-button color="accent"
                  (OnClick)="table.refresh()">
        <mat-icon>refresh</mat-icon>
        <div>Refresh</div>
      </app-button>
    </div>
  </div>

  <hr>

  <ng-template #actions
               let-element>
    <app-button *ngIf="hasWriteAuthorization"
                appHighlight
                color="accent"
                (OnClick)="showDeletePrompt($event, element)">
      <mat-icon>delete</mat-icon>
      <div>Delete</div>
    </app-button>
  </ng-template>

  <app-list-table #table
                  [$records]="$records"
                  [$refresh]="$refresh"
                  [columns]="columns"
                  [count]="count"
                  [filter]="filter"
                  [find]="find"
                  [navigate]="navigate"
                  [subscriptions]="subscriptions"
                  [template]="actions"
                  [webSocket]="webSocket">
  </app-list-table>
</div>
