<div class="page">
  <div class="header">
    <app-title>Web Sockets</app-title>

    <div class="header-end">
      <app-button color="accent"
                  (OnClick)="table.refresh()">
        <mat-icon>refresh</mat-icon>
        <div>Refresh</div>
      </app-button>
    </div>
  </div>

  <hr>

  <app-toggle-section [isVisible]="false"
                      title="Filters">
    <div align-items="end"
         column-gap-16
         flex-wrap-8>
      <mat-checkbox (change)="table.refresh()"
                    [(ngModel)]="includeConnected">Connected</mat-checkbox>
      <mat-checkbox (change)="table.refresh()"
                    [(ngModel)]="includeDisconnected">Disconnected</mat-checkbox>
      <app-data-source-filter (OnValueSet)="$filter.next($event)">
        User ID
      </app-data-source-filter>
    </div>
  </app-toggle-section>

  <hr>

  <app-list-table #table
                  [$records]="$records"
                  [$refresh]="$refresh"
                  [columns]="columns"
                  [count]="count"
                  [filter]="filter"
                  [find]="find"
                  [subscriptions]="subscriptions"
                  [webSocket]="webSocket">
  </app-list-table>
</div>
