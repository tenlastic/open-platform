<div class="page">
  <div class="header">
    <app-title>Collections</app-title>

    <div class="header-end">
      <app-button *ngIf="hasWriteAuthorization"
                  color="accent"
                  [routerLink]="['new']">
        <mat-icon>add</mat-icon>
        <div>New Collection</div>
      </app-button>

      <app-button color="accent"
                  (OnClick)="table.refresh()">
        <mat-icon>refresh</mat-icon>
        <div>Refresh</div>
      </app-button>
    </div>
  </div>

  <hr>

  <app-toggle-section [isVisible]="false"
                      title="Filters">
    <app-data-source-filter (OnValueSet)="setFilter($event)">
      Name
    </app-data-source-filter>
  </app-toggle-section>

  <hr>

  <ng-template #actions
               let-element>
    <ng-container *ngIf="hasWriteAuthorization">
      <app-button color="accent"
                  appHighlight
                  (OnClick)="showDeletePrompt($event, element)">
        <mat-icon>delete</mat-icon>
        <div>Delete</div>
      </app-button>
    </ng-container>
  </ng-template>

  <app-list-table #table
                  [$records]="$records"
                  [$refresh]="$refresh"
                  [columns]="columns"
                  [count]="count"
                  [filter]="filter"
                  [find]="find"
                  [navigate]="navigate"
                  [subscriptions]="subscriptions"
                  [template]="actions"
                  [webSocket]="webSocket">
  </app-list-table>
</div>
