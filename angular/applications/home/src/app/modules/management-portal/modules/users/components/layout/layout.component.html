<router-outlet></router-outlet>

<ng-template #sideMenu>
  <ng-container *ngIf="$user | async as user">
    <app-button color="accent"
                layout="vertical"
                [ngClass]="{ active: isActive }"
                [routerLink]="['./']"
                text="left"
                width="full">
      <mat-icon>person</mat-icon>
      <div>{{ $displayName | async }}</div>
    </app-button>

    <hr *ngIf="$hasRelated | async">

    <app-button *ngIf="$hasPermission(IAuthorization.webSocketRoles) | async"
                color="accent"
                layout="vertical"
                [routerLink]="['web-sockets']"
                routerLinkActive="active"
                text="left"
                width="full">
      <mat-icon>hub</mat-icon>
      <div>Web Sockets</div>
    </app-button>
  </ng-container>
</ng-template>
