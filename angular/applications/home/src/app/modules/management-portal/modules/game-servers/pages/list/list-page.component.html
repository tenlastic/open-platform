<div class="page">
  <div class="header">
    <app-title>Game Servers</app-title>

    <div class="header-end">
      <app-button *ngIf="hasWriteAuthorization && !queueId"
                  color="accent"
                  [routerLink]="['new']">
        <mat-icon>add</mat-icon>
        <div>New Game Server</div>
      </app-button>

      <app-button color="accent"
                  (OnClick)="table.refresh()">
        <mat-icon>refresh</mat-icon>
        <div>Refresh</div>
      </app-button>
    </div>
  </div>

  <hr>

  <app-toggle-section [isVisible]="false"
                      title="Filters">
    <div align-items="end"
         column-gap-16
         flex-wrap-8>
      <app-data-source-filter (OnValueSet)="setFilter($event)">
        Name
      </app-data-source-filter>

      <mat-checkbox *ngIf="!queueId"
                    (change)="table.refresh()"
                    [(ngModel)]="matches">Matches</mat-checkbox>

      <mat-checkbox *ngIf="!queueId"
                    (change)="table.refresh()"
                    [(ngModel)]="queues">Queues</mat-checkbox>
    </div>
  </app-toggle-section>

  <hr>

  <ng-template #actions
               let-element>
    <app-button *ngIf="hasLogAuthorization"
                appHighlight
                color="accent"
                (OnClick)="showLogsOverlay($event, element)">
      <mat-icon>subject</mat-icon>
      <div>Logs</div>
    </app-button>

    <ng-container *ngIf="hasWriteAuthorization">
      <app-button *ngIf="element.persistent"
                  appHighlight
                  color="accent"
                  (click)="restart($event, element)">
        <mat-icon>sync</mat-icon>
        <div>Restart</div>
      </app-button>

      <app-button appHighlight
                  color="accent"
                  (OnClick)="showDeletePrompt($event, element)">
        <mat-icon>delete</mat-icon>
        <div>Delete</div>
      </app-button>
    </ng-container>
  </ng-template>

  <app-list-table #table
                  [$records]="$records"
                  [$refresh]="$refresh"
                  [columns]="columns"
                  [count]="count"
                  [filter]="filter"
                  [find]="find"
                  [navigate]="navigate"
                  [subscriptions]="subscriptions"
                  [template]="actions"
                  [webSocket]="webSocket">
  </app-list-table>
</div>
