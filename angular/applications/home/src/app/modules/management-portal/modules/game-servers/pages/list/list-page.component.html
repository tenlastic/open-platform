<div class="page"
     row-gap-16>
  <app-title>Game Servers</app-title>

  <div align-items="end"
       column-gap-16
       flex-wrap-16>
    <app-data-source-filter (OnValueSet)="setFilter($event)">
      Name
    </app-data-source-filter>

    <mat-checkbox *ngIf="!queueId"
                  (change)="table.refresh()"
                  [(ngModel)]="queues">Queues</mat-checkbox>

    <div align-items="end"
         column-gap-8
         margin-left-auto>
      <div *ngIf="hasWriteAuthorization && !queueId">
        <app-button color="accent"
                    [routerLink]="['new']">
          <mat-icon>add</mat-icon>
          <div>New Game Server</div>
        </app-button>
      </div>

      <div>
        <app-button color="accent"
                    (OnClick)="table.refresh()">
          <mat-icon>refresh</mat-icon>
          <div>Refresh</div>
        </app-button>
      </div>
    </div>
  </div>

  <ng-template #actions
               let-element>
    <app-button *ngIf="hasLogAuthorization"
                appHighlight
                color="accent"
                (OnClick)="showLogsOverlay($event, element)">
      <mat-icon>subject</mat-icon>
      <div>Logs</div>
    </app-button>

    <ng-container *ngIf="hasWriteAuthorization">
      <app-button *ngIf="element.persistent"
                  appHighlight
                  color="accent"
                  (click)="restart($event, element)">
        <mat-icon>sync</mat-icon>
        <div>Restart</div>
      </app-button>

      <app-button appHighlight
                  color="accent"
                  (OnClick)="showDeletePrompt($event, element)">
        <mat-icon>delete</mat-icon>
        <div>Delete</div>
      </app-button>
    </ng-container>
  </ng-template>

  <app-list-table #table
                  [$records]="$records"
                  [$refresh]="$refresh"
                  [columns]="columns"
                  [count]="count"
                  [filter]="filter"
                  [find]="find"
                  [navigate]="navigate"
                  [subscriptions]="subscriptions"
                  [template]="actions"
                  [webSocket]="webSocket">
  </app-list-table>
</div>
