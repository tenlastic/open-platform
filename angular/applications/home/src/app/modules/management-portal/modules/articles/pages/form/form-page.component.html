<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title *ngIf="hasWriteAuthorization">{{ data?._id ? 'Edit' : 'Create' }} {{ singular }}</app-title>
      <app-title *ngIf="!hasWriteAuthorization">View {{ singular }}</app-title>

      <div class="header-end">
        <app-button *ngIf="hasWriteAuthorization"
                    color="accent"
                    (OnClick)="navigateToJson()">
          <mat-icon>code</mat-icon>
          <div>{{ data?._id ? 'Edit' : 'Create' }} as JSON</div>
        </app-button>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          (ngSubmit)="save()">
      <div class="form-row">
        <app-form-field>
          <label>Title</label>
          <input appAutofocus
                 formControlName="title"
                 maxlength="96"
                 required />
          <app-error>Enter a valid title.</app-error>
        </app-form-field>

        <app-form-field>
          <label>Subtitle</label>
          <input formControlName="subtitle"
                 maxlength="96" />
          <app-error>Enter a valid subtitle.</app-error>
        </app-form-field>
      </div>

      <div *ngIf="!type"
           class="form-row">
        <app-form-field>
          <label>Type</label>
          <mat-select formControlName="type">
            <mat-option *ngFor="let type of types"
                        [value]="type.value">
              {{ type.label }}
            </mat-option>
          </mat-select>
          <app-error>Choose a type.</app-error>
        </app-form-field>
      </div>

      <hr>

      <div class="form-row">
        <div flex-1>
          <app-form-field>
            <label>Body (Markdown)</label>
            <textarea cdkTextareaAutosize
                      required
                      formControlName="body"
                      cdkAutosizeMinRows="3"
                      type="text"></textarea>
            <app-error>Enter a valid body.</app-error>
          </app-form-field>
        </div>

        <div class="markdown-preview"
             flex-1>
          <label>Body (Preview)</label>
          <app-markdown [markdown]="form.get('body').value"></app-markdown>
        </div>
      </div>
    </form>
  </div>

  <div *ngIf="!form.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
