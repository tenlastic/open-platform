<ng-container *ngIf="form">
  <div class="page"
       row-gap-16>

    <div align-items="end"
         column-gap-16
         flex-wrap-16>
      <app-title *ngIf="hasWriteAuthorization">{{ data?._id ? 'Edit' : 'Create' }} Authorization</app-title>
      <app-title *ngIf="!hasWriteAuthorization">View Authorization</app-title>

      <div align-items="end"
           column-gap-8
           margin-left-auto>
        <div *ngIf="hasWriteAuthorization">
          <app-button color="accent"
                      (OnClick)="navigateToJson()">
            <mat-icon>code</mat-icon>
            <div>{{ data?._id ? 'Edit' : 'Create' }} as JSON</div>
          </app-button>
        </div>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          row-gap-16
          (ngSubmit)="save()">
      <div align-items="start"
           column-gap-16
           flex-wrap>
        <app-form-field>
          <label>Type</label>
          <mat-select formControlName="type">
            <mat-option *ngFor="let type of AuthorizationType | keyvalue"
                        [value]="type.value">
              {{ type.value }}
            </mat-option>
          </mat-select>
          <app-error>Choose a type.</app-error>
        </app-form-field>

        <ng-container *ngIf="type === AuthorizationType.ApiKey">
          <app-form-field>
            <label>Name</label>
            <input formControlName="name"
                   maxlength="64"
                   required />
            <app-error>Enter a name.</app-error>
          </app-form-field>
        </ng-container>

        <ng-container *ngIf="type === AuthorizationType.User">
          <app-autocomplete-user-field [control]="form.get('user')"></app-autocomplete-user-field>

          <app-form-field>
            <label>Ban</label>
            <mat-select formControlName="bannedAt">
              <mat-option [value]="true">Yes</mat-option>
              <mat-option [value]="false">No</mat-option>
            </mat-select>
            <app-error>Choose a type.</app-error>
          </app-form-field>
        </ng-container>
      </div>

      <hr>

      <app-toggle-section *ngIf="!form.get('bannedAt').value"
                          title="Roles">
        <app-role-fields [form]="form"
                         [play]="namespaceId"></app-role-fields>
      </app-toggle-section>
    </form>
  </div>

  <div *ngIf="!form.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
