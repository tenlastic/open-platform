<div class="page"
     row-gap-16>
  <app-title>Builds</app-title>

  <div align-items="end"
       column-gap-16
       flex-wrap-16>
    <app-data-source-filter (OnValueSet)="setFilter($event)">
      Name / Status
    </app-data-source-filter>

    <div align-items="end"
         column-gap-8
         margin-left-auto>
      <div *ngIf="hasWriteAuthorization">
        <app-button color="accent"
                    [routerLink]="['new']">
          <mat-icon>add</mat-icon>
          <div>New Build</div>
        </app-button>
      </div>

      <div>
        <app-button color="accent"
                    (OnClick)="table.refresh()">
          <mat-icon>refresh</mat-icon>
          <div>Refresh</div>
        </app-button>
      </div>
    </div>
  </div>

  <ng-template #actions
               let-element>
    <ng-container *ngIf="hasWriteAuthorization">
      <app-button *ngIf="element.publishedAt"
                  color="accent"
                  appHighlight
                  (OnClick)="unpublish($event, element)">
        <mat-icon>visibility_off</mat-icon>
        <div>Unpublish</div>
      </app-button>

      <app-button *ngIf="!element.publishedAt && element.status.phase === 'Succeeded'"
                  color="accent"
                  appHighlight
                  (OnClick)="publish($event, element)">
        <mat-icon>visibility</mat-icon>
        <div>Publish</div>
      </app-button>

      <app-button color="accent"
                  appHighlight
                  (OnClick)="showDeletePrompt($event, element)">
        <mat-icon>delete</mat-icon>
        <div>Delete</div>
      </app-button>
    </ng-container>
  </ng-template>

  <app-list-table #table
                  [$records]="$records"
                  [$refresh]="$refresh"
                  [columns]="columns"
                  [count]="count"
                  [filter]="filter"
                  [find]="find"
                  [navigate]="navigate"
                  [subscriptions]="subscriptions"
                  [template]="actions"
                  [webSocket]="webSocket">
  </app-list-table>
</div>
