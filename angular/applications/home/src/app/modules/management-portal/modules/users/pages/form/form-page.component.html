<ng-container *ngIf="form">
  <div class="page">
    <div class="header">
      <app-title *ngIf="hasWriteAuthorization">{{ data?._id ? 'Edit' : 'Create' }} User</app-title>
      <app-title *ngIf="!hasWriteAuthorization">View User</app-title>

      <div *ngIf="hasWriteAuthorization"
           class="header-end">
        <app-button color="accent"
                    (OnClick)="navigateToJson()">
          <mat-icon>code</mat-icon>
          <div>{{ data?._id ? 'Edit' : 'Create' }} as JSON</div>
        </app-button>
      </div>
    </div>

    <hr>

    <form autocomplete="off"
          [formGroup]="form"
          id="form"
          (ngSubmit)="save()">
      <div class="form-row">
        <app-form-field>
          <label>Email Address</label>
          <input appAutofocus
                 formControlName="email"
                 maxlength="256"
                 type="email" />
          <app-error>Enter a valid email address.</app-error>
        </app-form-field>

        <app-form-field>
          <label>Username</label>
          <input formControlName="username"
                 maxlength="24"
                 required />
          <app-error>Enter a valid alphanumeric username.</app-error>
        </app-form-field>
      </div>

      <div *ngIf="form.get('steamId').value || form.get('steamPersonaName').value"
           class="row">
        <app-form-field *ngIf="form.get('steamId').value">
          <label>Steam ID</label>
          <input formControlName="steamId" />
          <app-error>Enter a valid Steam ID.</app-error>
        </app-form-field>

        <app-form-field *ngIf="form.get('steamPersonaName').value">
          <label>Steam Persona name</label>
          <input formControlName="steamPersonaName" />
          <app-error>Enter a valid Steam Persona Name.</app-error>
        </app-form-field>
      </div>
    </form>
  </div>

  <div *ngIf="!form.disabled"
       class="actions">
    <div *ngFor="let error of errors"
         class="form-error">
      {{ error }}
    </div>

    <app-button *ngIf="!isSaving"
                color="primary"
                form="form"
                size="large"
                width="full">
      <mat-icon>save</mat-icon>
      <div>Save</div>
    </app-button>
    <app-button *ngIf="isSaving"
                color="primary"
                disabled="true"
                size="large"
                width="full">
      <mat-spinner diameter="20"></mat-spinner>
      <div>Saving...</div>
    </app-button>
  </div>
</ng-container>

<app-loading-message *ngIf="!form">Loading...</app-loading-message>
