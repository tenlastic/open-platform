<div class="form-row"
     [formGroup]="form">
  <app-form-field>
    <label>Type</label>
    <mat-select formControlName="type"
                required>
      <mat-option [value]="ProbeType.Exec">Command</mat-option>
      <mat-option [value]="ProbeType.Http">HTTP</mat-option>
      <mat-option [value]="ProbeType.None">None</mat-option>
      <mat-option [value]="ProbeType.Tcp">TCP</mat-option>
    </mat-select>
  </app-form-field>

  <app-form-field *ngIf="type === ProbeType.Exec">
    <label>Command</label>
    <input formControlName="command"
           maxlength="256" />
    <app-error>Enter a valid command.</app-error>
  </app-form-field>

  <app-form-field *ngIf="type !== ProbeType.None">
    <label>Initial Delay Seconds</label>
    <input formControlName="initialDelaySeconds"
           step="1"
           type="number" />
    <app-error>Enter a valid number of seconds.</app-error>
  </app-form-field>

  <app-form-field *ngIf="type === ProbeType.Http">
    <label>Path</label>
    <input formControlName="path"
           maxlength="128" />
    <app-error>Enter a valid path.</app-error>
  </app-form-field>

  <app-form-field *ngIf="type === ProbeType.Http || type === ProbeType.Tcp">
    <label>Port</label>
    <input formControlName="port"
           type="number" />
    <app-error>Enter a valid port.</app-error>
  </app-form-field>
</div>
