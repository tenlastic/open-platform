<div row-gap-8>
  <div *ngFor="let property of formArray['controls']; let i = index"
       row-gap-4>
    <h4>Property {{ i + 1 }}</h4>

    <app-metadata-field [form]="property"
                        (remove)="removeProperty(i)"></app-metadata-field>
  </div>

  <app-button *ngIf="!formArray?.disabled"
              color="accent"
              layout="left"
              (OnClick)="addProperty()">
    <mat-icon>add</mat-icon>
    <div>Add Property</div>
  </app-button>
</div>
