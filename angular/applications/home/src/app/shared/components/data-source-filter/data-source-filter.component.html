<app-form-field>
  <label>
    <ng-content></ng-content>
  </label>

  <input autocomplete="off"
         type="text"
         (keyup)="setValue($event.target.value)"
         [(ngModel)]="value" />
</app-form-field>

<app-button *ngIf="value"
            color="accent"
            (click)="clear()">
  <mat-icon>close</mat-icon>
  <div>Clear</div>
</app-button>
