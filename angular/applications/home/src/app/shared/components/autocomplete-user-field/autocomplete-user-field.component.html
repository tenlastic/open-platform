<app-form-field>
  <label>Username</label>

  <input [formControl]="control"
         [matAutocomplete]="autocomplete"
         (focusout)="onFocusOut()"
         (keyup)="onUsernameChanged($event.target.value)" />
  <app-button *ngIf="removeButton"
              color="accent"
              [matTooltip]="removeButtonTooltip"
              (OnClick)="OnRemove.emit()">
    <mat-icon>remove</mat-icon>
  </app-button>

  <app-error>Select a valid User.</app-error>

  <mat-autocomplete #autocomplete="matAutocomplete"
                    [displayWith]="displayWith">
    <mat-option *ngIf="isLoading"
                class="is-loading"
                disabled>
      <mat-spinner diameter="25"></mat-spinner>
    </mat-option>

    <ng-container *ngIf="!isLoading">
      <mat-option *ngFor="let user of ($users | async)"
                  [value]="user">
        <div>{{ user.displayName }}</div>
      </mat-option>
    </ng-container>
  </mat-autocomplete>
</app-form-field>
