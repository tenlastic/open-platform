      MINIO_CONNECTION_STRING: http://minioadmin:minioadmin@minio:9000
      MONGO_CONNECTION_STRING: mongodb://mongo:27017/admin?replicaSet=rs0
      NATS_CONNECTION_STRING: nats:4222
      PASSWORD_RESET_URL: http://www.local.tenlastic.com/authentication/reset-password
    ports:
      - 3000:3000
    user: ${USER_ID}:${GROUP_ID}
    volumes:
      - /etc/group:/etc/group:ro
      - /etc/passwd:/etc/passwd:ro
      - ./:/usr/src/
    working_dir: /usr/src/

  minio:
    command: server /data --console-address :9001
    image: minio/minio:RELEASE.2022-12-12T19-27-27Z
    ports:
      - 9000:9000
      - 9001:9001

  mongo:
    command: --bind_ip_all --replSet rs0
    image: mongo:6.0.2
    ports:
      - 27017:27017

  mongo_sidecar:
    command:
      - |
        echo "Waiting for MongoDB to be ready..."
        until mongosh --eval "db.adminCommand('ping')" --host mongo; do
          echo "Still waiting for MongoDB to be ready..."
          sleep 1
        done

        echo "Initializing replica set..." 
        mongosh --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})' --host mongo

        echo "Replica set initialized!"
    entrypoint: sh -c
    image: mongo:6.0.2

  nats:
    image: nats:2.9.17-alpine
    ports:
      - 4222:4222
      - 8222:8222
    command: -js
